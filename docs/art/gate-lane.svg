<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of a single gate evaluation: request, shape, reserved names, authorization, budget, state, human gap, and aggregate. A request describes one planned action with its kind, its target and an estimated cost in tokens and wall time. Five fields are allowed at the root and any other field is refused. Reserved names are rejected at every level of the object rather than only at the top, so a forbidden key cannot hide inside a nested block. Four checks then run: authorization, budget, state and the human gap. Each check returns one of four values: pass, fail, unknown, or not applicable. The state check reads a witness verdict from a closed set of seven, of which only three count as confirming, alongside a target digest and the digest that was expected. The aggregate is not a vote. One failure anywhere denies the action; with no failure but any unknown the answer is that a person still has to look; allow requires authorization to pass outright and the other three to pass or not apply. Three outcomes: allow, deny, and needs human."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">ONE PLANNED ACTION, ONE DECISION</text><text class="h" x="44" y="72">What the pre-execution gate reads before an agent is allowed to act</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M592.25 206V228H367.75V213"/><text class="k" x="480" y="245" text-anchor="middle" fill="var(--drift)">A MALFORMED REQUEST IS DENIED, NOT PARSED</text><path class="back" marker-end="url(#ab)" d="M816.75 398V420H367.75V405"/><text class="k" x="592.25" y="437" text-anchor="middle" fill="var(--drift)">THREE OF SEVEN VERDICTS CONFIRM ANYTHING</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Request</text><text class="s" x="58" y="168">One planned action, and what</text><text class="s" x="58" y="183">it costs.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Shape</text><text class="s" x="282.5" y="168">Five fields at the root. No</text><text class="s" x="282.5" y="183">others.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Reserved</text><text class="s" x="507" y="168">A refused name at any depth,</text><text class="s" x="507" y="183">not just the top.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Authorization</text><text class="s" x="731.5" y="168">A grant, or the action is</text><text class="s" x="731.5" y="183">denied outright.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Budget</text><text class="s" x="58" y="360">Tokens, wall time and actions</text><text class="s" x="58" y="375">still left.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">State</text><text class="s" x="282.5" y="360">A witness verdict and two</text><text class="s" x="282.5" y="375">digests.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Human gap</text><text class="s" x="507" y="360">Whether a person still has to</text><text class="s" x="507" y="375">look.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Aggregate</text><text class="s" x="731.5" y="360">The weakest of the four checks</text><text class="s" x="731.5" y="375">decides.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">ALLOW</text><text class="s" x="58" y="509" font-size="10.5">every check passed or did not apply</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">DENY</text><text class="s" x="357.33" y="509" font-size="10.5">one check failed, and one is enough</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">NEEDS HUMAN</text><text class="s" x="656.67" y="509" font-size="10.5">nothing failed, something is unknown</text><text class="s" x="44" y="546">The gate reports a decision and grants no authority. Nothing it returns is fed back into a model as trusted state, and a request it cannot parse is denied rather than passed along.</text></svg>
