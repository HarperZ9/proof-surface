<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of one domain run: evidence, wedge, contract, honesty gate, measure, combine, decide, and bundle. Evidence starts as a trace, a run record or a measurement already on disk. One command routes it to one of eleven domain wedges, each of which owns its own arguments. The contract rejects unknown fields rather than ignoring them, so an unrecognised document is unverifiable rather than valid. Each wedge then applies its own refusal, the rule that stops that domain's characteristic overclaim. Measurement is a margin: tolerance minus deviation, over tolerance, matching if that margin is at or above zero. The combination is not an average. Unverifiable dominates, then drift, and an empty set reads as a match because there is nothing to refute. One decision follows from the overall verdict, with a closed vocabulary of seven outcomes and three confidence levels, defaulting to escalate when the verdict is not recognised. Four artifacts are written and hashed into one manifest, which records a digest per file and a digest over those digests. Three outcomes: match, drift, and unverifiable."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">EVIDENCE IN, PACKET OUT</text><text class="h" x="44" y="72">How raw evidence becomes a packet a reader can re-derive without the tool</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 206V228H367.75V213"/><text class="k" x="592.25" y="245" text-anchor="middle" fill="var(--drift)">EACH WEDGE BRINGS ITS OWN REFUSAL</text><path class="back" marker-end="url(#ab)" d="M816.75 398V420H143.25V405"/><text class="k" x="480" y="437" text-anchor="middle" fill="var(--drift)">A READER RECOMPUTES BOTH FROM THE BYTES</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Evidence</text><text class="s" x="58" y="168">A trace, a run, a measurement</text><text class="s" x="58" y="183">on disk.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Wedge</text><text class="s" x="282.5" y="168">One of eleven domains, one</text><text class="s" x="282.5" y="183">command.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Contract</text><text class="s" x="507" y="168">An unknown field is refused,</text><text class="s" x="507" y="183">not ignored.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Honesty gate</text><text class="s" x="731.5" y="168">The refusal that domain is</text><text class="s" x="731.5" y="183">built around.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Measure</text><text class="s" x="58" y="360">Deviation read against a</text><text class="s" x="58" y="375">tolerance.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Combine</text><text class="s" x="282.5" y="360">Unverifiable wins, then drift.</text><text class="s" x="282.5" y="375">No average.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Decide</text><text class="s" x="507" y="360">One decision, derived from the</text><text class="s" x="507" y="375">verdict.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Bundle</text><text class="s" x="731.5" y="360">Four artifacts under one</text><text class="s" x="731.5" y="375">hashed bundle.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">MATCH</text><text class="s" x="58" y="509" font-size="10.5">every claim held inside its tolerance</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">DRIFT</text><text class="s" x="357.33" y="509" font-size="10.5">one claim moved outside its tolerance</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">UNVERIFIABLE</text><text class="s" x="656.67" y="509" font-size="10.5">a claim could not be checked at all</text><text class="s" x="44" y="546">An empty measurement set reads as a match, because there is nothing left to refute. A missing deviation, or a tolerance at or below zero, reads as unverifiable instead of quietly passing.</text></svg>
